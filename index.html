", "adj": 1.04, "core": 0.94, "narr": 0.1, "seed": null, "drought": 6, "path": [{"round": "Division Series", "opp": "Tampa Bay Rays", "result": "3-1"}, {"round": "Championship Series", "opp": "Detroit Tigers", "result": "4-2"}, {"round": "World Series", "opp": "St. Louis Cardinals", "result": "4-2"}]}, {"champion": "San Francisco Giants", "season": "2014", "sport": "MLB", "adj": 0.79, "core": 0.73, "narr": 0.05, "seed": null, "drought": 2, "path": [{"round": "Wild Card Series", "opp": "Pittsburgh Pirates", "result": "1-0"}, {"round": "Division Series", "opp": "Washington Nationals", "result": "3-1"}, {"round": "Championship Series", "opp": "St. Louis Cardinals", "result": "4-1"}, {"round": "World Series", "opp": "Kansas City Royals", "result": "4-3"}]}, {"champion": "Kansas City Royals", "season": "2015", "sport": "MLB", "adj": 0.92, "core": 0.74, "narr": 0.17, "seed": null, "drought": 30, "path": [{"round": "Division Series", "opp": "Houston Astros", "result": "3-2"}, {"round": "Championship Series", "opp": "Toronto Blue Jays", "result": "4-2"}, {"round": "World Series", "opp": "New York Mets", "result": "4-1"}]}, {"champion": "Chicago Cubs", "season": "2016", "sport": "MLB", "adj": 1.19, "core": 0.95, "narr": 0.23, "seed": null, "drought": 108, "path": [{"round": "Division Series", "opp": "San Francisco Giants", "result": "3-1"}, {"round": "Championship Series", "opp": "Los Angeles Dodgers", "result": "4-2"}, {"round": "World Series", "opp": "Cleveland Indians", "result": "4-3"}]}, {"champion": "Houston Astros", "season": "2017", "sport": "MLB", "adj": 1.21, "core": 1.01, "narr": 0.2, "seed": null, "drought": 55, "path": [{"round": "Division Series", "opp": "Boston Red Sox", "result": "3-1"}, {"round": "Championship Series", "opp": "New York Yankees", "result": "4-3"}, {"round": "World Series", "opp": "Los Angeles Dodgers", "result": "4-3"}]}, {"champion": "Boston Red Sox", "season": "2018", "sport": "MLB", "adj": 0.9, "core": 0.81, "narr": 0.09, "seed": null, "drought": 5, "path": [{"round": "Division Series", "opp": "New York Yankees", "result": "3-1"}, {"round": "Championship Series", "opp": "Houston Astros", "result": "4-1"}, {"round": "World Series", "opp": "Los Angeles Dodgers", "result": "4-1"}]}, {"champion": "Washington Nationals", "season": "2019", "sport": "MLB", "adj": 1.01, "core": 0.81, "narr": 0.2, "seed": null, "drought": 50, "path": [{"round": "Wild Card Series", "opp": "Milwaukee Brewers", "result": "1-0"}, {"round": "Division Series", "opp": "Los Angeles Dodgers", "result": "3-2"}, {"round": "Championship Series", "opp": "St. Louis Cardinals", "result": "4-0"}, {"round": "World Series", "opp": "Houston Astros", "result": "4-3"}]}, {"champion": "Los Angeles Dodgers", "season": "2020", "sport": "MLB", "adj": 0.94, "core": 0.77, "narr": 0.17, "seed": null, "drought": 32, "path": [{"round": "Wild Card Series", "opp": "Milwaukee Brewers", "result": "1-0"}, {"round": "Division Series", "opp": "San Diego Padres", "result": "3-0"}, {"round": "Championship Series", "opp": "Atlanta Braves", "result": "4-3"}, {"round": "World Series", "opp": "Tampa Bay Rays", "result": "4-2"}]}, {"champion": "Atlanta Braves", "season": "2021", "sport": "MLB", "adj": 1.05, "core": 0.88, "narr": 0.16, "seed": null, "drought": 26, "path": [{"round": "Division Series", "opp": "Milwaukee Brewers", "result": "3-1"}, {"round": "Championship Series", "opp": "Los Angeles Dodgers", "result": "4-2"}, {"round": "World Series", "opp": "Houston Astros", "result": "4-2"}]}, {"champion": "Houston Astros", "season": "2022", "sport": "MLB", "adj": 0.99, "core": 0.9, "narr": 0.09, "seed": null, "drought": 5, "path": [{"round": "Division Series", "opp": "Seattle Mariners", "result": "3-0"}, {"round": "Championship Series", "opp": "New York Yankees", "result": "4-0"}, {"round": "World Series", "opp": "Philadelphia Phillies", "result": "4-3"}]}, {"champion": "Texas Rangers", "season": "2023", "sport": "MLB", "adj": 0.9, "core": 0.69, "narr": 0.21, "seed": null, "drought": 62, "path": [{"round": "Wild Card Series", "opp": "Tampa Bay Rays", "result": "2-0"}, {"round": "Division Series", "opp": "Baltimore Orioles", "result": "3-0"}, {"round": "Championship Series", "opp": "Houston Astros", "result": "4-3"}, {"round": "World Series", "opp": "Arizona Diamondbacks", "result": "4-1"}]}, {"champion": "Los Angeles Dodgers", "season": "2024", "sport": "MLB", "adj": 0.86, "core": 0.78, "narr": 0.08, "seed": null, "drought": 4, "path": [{"round": "Division Series", "opp": "San Diego Padres", "result": "3-2"}, {"round": "Championship Series", "opp": "New York Mets", "result": "4-2"}, {"round": "World Series", "opp": "New York Yankees", "result": "4-1"}]}, {"champion": "Los Angeles Dodgers", "season": "2025", "sport": "MLB", "adj": 0.81, "core": 0.78, "narr": 0.03, "seed": null, "drought": 1, "path": [{"round": "Wild Card Series", "opp": "Cincinnati Reds", "result": "1-0"}, {"round": "Division Series", "opp": "Philadelphia Phillies", "result": "3-1"}, {"round": "Championship Series", "opp": "Milwaukee Brewers", "result": "4-0"}, {"round": "World Series", "opp": "Toronto Blue Jays", "result": "4-3"}]}];

const SPORT_COLORS = {NBA:'#e8963e',NFL:'#4a8f4a',NHL:'#5a9fd4',MLB:'#c85450'};
function tierInfo(adj){
  if(adj>=1.80) return {label:'LEGENDARY',color:'#e8b318'};
  if(adj>=1.40) return {label:'ELITE',color:'#d4a017'};
  if(adj>=1.00) return {label:'SOLID',color:'#4a9e6e'};
  if(adj>=0.70) return {label:'LIGHT',color:'#7a8a99'};
  return {label:'FREEBIE',color:'#b85450'};
}

// Game state
let stats = {total:0, correct:0, streak:0, best:0};
let playHistory = [];
let crowdsource = {}; // key: "teamA_season vs teamB_season" -> {a_picks, b_picks}
let activeSports = new Set(['NBA','NFL','NHL','MLB']);
let cardA = null, cardB = null, revealed = false;

// Load saved state from localStorage
try {
  const saved = localStorage.getItem('rdi_game_state');
  if(saved) {
    const s = JSON.parse(saved);
    stats = s.stats || stats;
    playHistory = s.playHistory || [];
    crowdsource = s.crowdsource || {};
  }
} catch(e) {}

function saveState() {
  try {
    localStorage.setItem('rdi_game_state', JSON.stringify({stats, playHistory, crowdsource}));
  } catch(e) {}
}

function getPool() {
  return DATA.filter(d => activeSports.has(d.sport));
}

function pickTwo() {
  const pool = getPool();
  if(pool.length < 2) return null;
  let a, b;
  do {
    a = pool[Math.floor(Math.random()*pool.length)];
    b = pool[Math.floor(Math.random()*pool.length)];
  } while(a.season===b.season && a.champion===b.champion);
  return [a, b];
}

function renderCard(item, side, container) {
  const div = document.createElement('div');
  div.className = 'card';
  div.id = 'card-'+side;
  const seedStr = item.seed ? `#${item.seed} seed` : '';
  const droughtStr = item.drought >= 10 ? ` · ${item.drought}-yr drought` : '';
  let pathHtml = '';
  if(item.path && item.path.length) {
    pathHtml = '<div class="card-path">';
    item.path.forEach((p,i) => {
      pathHtml += `<div class="path-row"><span class="round">${p.round.replace('Conference ','Conf. ').replace('Championship','Champ.').replace('Stanley Cup ','SC ').replace('World Series','WS').replace('Division Series','DS').replace('Wild Card Series','WC').substring(0,12)}</span><span class="opp">${p.opp}</span><span class="result">${p.result}</span></div>`;
    });
    pathHtml += '</div>';
  }
  div.innerHTML = `<span class="card-sport ${item.sport}">${item.sport}</span><div class="card-season">${item.season}</div><div class="card-name">${item.champion}</div><div class="card-meta">${seedStr}${droughtStr}</div>${pathHtml}<div class="card-prompt">👆 This ring is worth more</div>`;
  div.onclick = () => { if(!revealed) makeChoice(side); };
  container.appendChild(div);
}

function makeChoice(side) {
  revealed = true;
  const chosen = side==='a' ? cardA : cardB;
  const other = side==='a' ? cardB : cardA;

  const diff = Math.abs(cardA.adj - cardB.adj);
  let correct;
  if(diff < 0.02) {
    correct = true; // tie — both answers accepted
  } else {
    correct = chosen.adj >= other.adj;
  }

  // Update stats
  stats.total++;
  if(correct) { stats.correct++; stats.streak++; if(stats.streak>stats.best) stats.best=stats.streak; }
  else { stats.streak=0; }

  // Record play
  const play = {
    a: {champion:cardA.champion, season:cardA.season, sport:cardA.sport, adj:cardA.adj},
    b: {champion:cardB.champion, season:cardB.season, sport:cardB.sport, adj:cardB.adj},
    choice: side,
    correct: correct,
    timestamp: new Date().toISOString(),
  };
  playHistory.push(play);

  // Crowdsource tracking
  const matchKey = [cardA.champion+' '+cardA.season, cardB.champion+' '+cardB.season].sort().join(' vs ');
  if(!crowdsource[matchKey]) crowdsource[matchKey] = {};
  const pickedKey = chosen.champion+' '+chosen.season;
  crowdsource[matchKey][pickedKey] = (crowdsource[matchKey][pickedKey]||0) + 1;

  saveState();
  revealCards(side, correct, diff < 0.02);
  updateStats();
}

function revealCards(chosenSide, correct, isTie) {
  ['a','b'].forEach(side => {
    const card = document.getElementById('card-'+side);
    const item = side==='a' ? cardA : cardB;
    const tier = tierInfo(item.adj);
    const isChosen = side===chosenSide;
    const isHigher = item.adj >= (side==='a'?cardB:cardA).adj;

    card.classList.add('revealed','disabled');
    if(isTie) card.classList.add('winner');
    else if(isHigher) card.classList.add('winner');
    else card.classList.add('loser');

    // Replace prompt with score
    const prompt = card.querySelector('.card-prompt');
    prompt.outerHTML = `<div class="score-reveal"><div class="rings-val" style="color:${tier.color}">${item.adj.toFixed(2)}</div><div class="rings-label">${tier.label}</div><div class="breakdown">Core: ${item.core.toFixed(2)} | Narrative: +${item.narr.toFixed(2)}</div></div>`;
  });

  // Result banner
  const banner = document.getElementById('resultBanner');
  if(isTie) {
    banner.innerHTML = `<div class="result-banner tie">⚡ Dead heat! Both rings within 0.02 — either answer counts.</div>`;
  } else if(correct) {
    banner.innerHTML = `<div class="result-banner correct">✓ Correct! ${stats.streak} in a row</div>`;
  } else {
    banner.innerHTML = `<div class="result-banner wrong">✗ Wrong! Streak ended at ${playHistory.length > 1 ? playHistory[playHistory.length-2].correct ? '...' : '0' : '0'}</div>`;
  }

  // Next button
  document.getElementById('nextArea').innerHTML = '<button class="next-btn" onclick="newRound()">Next Matchup →</button>';
}

function updateStats() {
  document.getElementById('totalPlays').textContent = stats.total;
  document.getElementById('correctCount').textContent = stats.correct;
  document.getElementById('pctCorrect').textContent = stats.total > 0 ? Math.round(stats.correct/stats.total*100)+'%' : '—';
  document.getElementById('currentStreak').textContent = stats.streak;
  document.getElementById('bestStreak').textContent = stats.best;
}

function newRound() {
  revealed = false;
  document.getElementById('resultBanner').innerHTML = '';
  document.getElementById('nextArea').innerHTML = '';
  const pair = pickTwo();
  if(!pair) { document.getElementById('gameArea').innerHTML = '<p style="color:#666">Select at least 2 sports.</p>'; return; }
  [cardA, cardB] = pair;
  const area = document.getElementById('gameArea');
  area.innerHTML = '';
  renderCard(cardA, 'a', area);
  const vs = document.createElement('div');
  vs.className = 'vs';
  vs.textContent = 'VS';
  area.appendChild(vs);
  renderCard(cardB, 'b', area);
}

function initSportToggles() {
  const container = document.getElementById('sportToggles');
  ['NBA','NFL','NHL','MLB'].forEach(s => {
    const b = document.createElement('button');
    b.className = 'sport-toggle active';
    b.style.color = SPORT_COLORS[s];
    b.textContent = s;
    b.onclick = () => {
      if(activeSports.has(s)) activeSports.delete(s); else activeSports.add(s);
      if(activeSports.size===0) activeSports = new Set(['NBA','NFL','NHL','MLB']);
      b.classList.toggle('active', activeSports.has(s));
      if(!revealed) newRound();
    };
    container.appendChild(b);
  });
}

function exportData() {
  const blob = new Blob([JSON.stringify({stats, playHistory}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'rdi_play_history.json'; a.click();
  URL.revokeObjectURL(url);
}

function exportCrowdsource() {
  // Aggregate: for each championship, how often picked as "higher"
  const teamPicks = {};
  playHistory.forEach(p => {
    const chosen = p.choice==='a' ? p.a : p.b;
    const other = p.choice==='a' ? p.b : p.a;
    const cKey = chosen.champion+' '+chosen.season+' ('+chosen.sport+')';
    const oKey = other.champion+' '+other.season+' ('+other.sport+')';
    teamPicks[cKey] = teamPicks[cKey] || {picked_higher:0, picked_lower:0, appearances:0};
    teamPicks[oKey] = teamPicks[oKey] || {picked_higher:0, picked_lower:0, appearances:0};
    teamPicks[cKey].picked_higher++;
    teamPicks[cKey].appearances++;
    teamPicks[oKey].picked_lower++;
    teamPicks[oKey].appearances++;
  });
  // Sort by pick rate
  const sorted = Object.entries(teamPicks).map(([k,v]) => ({
    championship: k,
    ...v,
    pick_rate: v.appearances > 0 ? Math.round(v.picked_higher/v.appearances*100) : 0,
  })).sort((a,b) => b.pick_rate - a.pick_rate);

  const blob = new Blob([JSON.stringify({total_plays: stats.total, crowdsource_rankings: sorted}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'rdi_crowdsource.json'; a.click();
  URL.revokeObjectURL(url);
}

// Init
initSportToggles();
updateStats();
newRound();
</script>
